# Render.com 一键部署描述文件（Blueprint）
#
# 为什么选 Render 作为首选：
#   1. 免费档不要信用卡，GitHub 登录即可；
#   2. 是「长驻进程 + 可写磁盘」，不是 Serverless —— 本项目的内存缓存与磁盘缓存
#      是防止额度被烧光的核心机制，Serverless 冷启动丢缓存会直接导致 Demo 当天没额度；
#   3. 支持环境变量注入 Access Secret，凭证不进仓库。
#
# 使用方式：把仓库连到 Render → New → Blueprint → 选本仓库 → 填 ZHIHU_ACCESS_SECRET。
#
# 注意：免费档 15 分钟无请求会休眠，冷启动约 30–50 秒。
#      评审当天请在评委访问前先自己打开一次唤醒，或升级到付费档。

services:
  - type: web
    name: opinion-evolution-tank
    runtime: node
    plan: free
    region: singapore # 离中国大陆评委最近的免费区
    branch: master
    buildCommand: |
      cd app/web && npm ci --no-audit --no-fund && npm run build
      cd ../server && npm ci --omit=dev --no-audit --no-fund
    startCommand: node app/server/src/index.js
    healthCheckPath: /api/status
    envVars:
      # 真实凭证在 Render 控制台手填，绝不写进本文件
      - key: ZHIHU_ACCESS_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      # 直答日额度守卫（实测该账号 2 次/日，可按实际调整）
      - key: ZHIDA_DAILY_LIMIT
        value: "2"
    # 生态缸缓存落盘目录：免费档没有持久卷，重启会丢。
    # 因此「演示缸」必须走 app/server/data/prebuilt-tanks.json（随仓库提交），
    # 而不是依赖运行时缓存。
